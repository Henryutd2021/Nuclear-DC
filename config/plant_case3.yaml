# Case 3 — BWRX-300 + main turbine + double-effect absorption, no ORC (v2.5 §B)
#
# Tests whether the ORC bottoming cycle in Case 2 actually pays for itself.
# Same as Case 2 minus the ~$2,800/kWe ORC capex; if Case 3 TAC > Case 2 TAC
# the ORC value is positive, otherwise the cogen story is better off without it.

case_id: 3
label: "Nuclear + absorption, no ORC"

equipment:
  reactor_enabled:            true
  turbine_enabled:            true
  orc_enabled:                false
  absorption_chiller_enabled: true
  electric_chiller_enabled:   true       # VCC backup
  tes_enabled:                false
  bess_enabled:               false
  ngcc_enabled:               false
  grid_import_enabled:        true
  grid_export_enabled:        true

capacities:
  reactor_thermal_capacity_MWth:  870.0
  turbine_capacity_MWe:           300.0
  absorption_capacity_MWth:       100.0
  electric_chiller_capacity_MWth: 100.0
  bess_capacity_MWh:              100.0
  bess_power_MW:                  25.0

# Reactor + turbine + absorption + VCC all identical to Case 2
reactor:
  thermal_power_MWth:           870
  electric_power_net_MWe:       270
  thermal_efficiency:           0.345
  capex_usd_per_kWe:            7615
  fixed_om_usd_per_kWe_year:    121
  variable_om_usd_per_mwh_e:    3.50
  fuel_cost_usd_per_mwh_th:     6.0
  co2_lifecycle_g_per_kwh_e:    12
  min_load_fraction:            0.50
  ramp_rate_pct_per_min:        1.0
  capacity_factor:              0.92
  lifetime_years:               20

turbine:
  rated_efficiency:               0.345
  capex_usd_per_kWe:              0
  fixed_om_usd_per_kWe_year:      0
  variable_om_usd_per_mwh_e:      0
  aux_load_fraction:              0.10

absorption:
  capex_usd_per_kWth:                       750
  fixed_om_usd_per_kWth_year:               20
  variable_om_usd_per_mwh_th:               0.4
  cop_nameplate:                            1.30
  cop_houston_baseline:                     1.10
  derate_per_celsius_above_baseline:        0.015
  cooling_water_approach_K:                 5
  crystallization_cw_inlet_C:               32
  parasitic_kWe_per_kWth:                   0.020
  lifetime_years:                           25

vcc:
  cop_baseline:                3.5
  cop_houston:                 3.2
  fixed_om_usd_per_kWth_year:  8
  variable_om_usd_per_mwh_th:  0.5
  capex_usd_per_kWth:          250
  lifetime_years:              25

# Lithium-ion BESS — same spec as Cases 1/2 (v2.5 S3 binary sensitivity)
bess:
  capex_usd_per_kwh:           405
  capex_usd_per_kw:            1620
  fixed_om_usd_per_kw_year:    25
  variable_om_usd_per_mwh:     0.5
  round_trip_efficiency:       0.85
  self_discharge_per_hour:     0.0000417
  soc_min_fraction:            0.05
  soc_max_fraction:            0.95
  initial_soc_fraction:        0.50
  lifetime_years:              15
