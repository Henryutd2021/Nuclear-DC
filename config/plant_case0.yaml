# Case 0 — Grid-Only Data Center (v2.5 §B locked spec)
#
# Plain English: DC buys all electricity from ERCOT, uses a vapor-compression
# (electric) chiller for cooling. No reactor, no heat recovery. This is the
# Heat-Recovery Premium denominator: every other case is benchmarked against
# this baseline TAC.
#
# Per v2.5 §2.1, Case 0 runs as an INDEPENDENT LP (not part of the unified
# MILP that ties Cases 1-3). With fixed PUE and no storage, the dispatch is
# effectively closed-form: every hour, grid imports cover P_IT + Q_cool/COP_VCC.
# We still construct a Pyomo model so the TAC accounting routes through the
# same code path as Cases 1-4 (§P1-C common-basis).

case_id: 0
label: "Grid-only baseline"

equipment:
  reactor_enabled:            false
  turbine_enabled:            false
  orc_enabled:                false
  absorption_chiller_enabled: false
  electric_chiller_enabled:   true     # vapor-compression chiller
  tes_enabled:                false    # no thermal storage
  bess_enabled:               false    # S3 toggled on later for Cases 1-3
  ngcc_enabled:               false    # Case 4 only
  grid_import_enabled:        true
  grid_export_enabled:        false    # DC is a pure load; no surplus to sell

# Equipment capacities (MW or MWth) — sized to cover the worst hour of the
# Case 2 IT trace (max ≈ 142.4 MW, plus cooling at PUE 1.50 worst-case).
capacities:
  electric_chiller_capacity_MWth: 120.0   # ≥ (PUE-1)*P_IT_max at PUE=1.50

# Vapor-compression chiller performance (v2.5 §B reference; no per-equipment
# YAML exists for VCC yet, so values inlined here from ASHRAE typical centrifugal
# chiller at Houston-grade ambient).
vcc:
  cop_baseline:    3.5     # nameplate water-cooled centrifugal
  cop_houston:     3.2     # ~8% derating at Houston wet-bulb 26°C (cooling-tower 32°C inlet)
  fixed_om_usd_per_kWth_year: 8
  variable_om_usd_per_mwh_th: 0.5
  capex_usd_per_kWth: 250  # installed turnkey (centrifugal, water-cooled)
  lifetime_years: 25
