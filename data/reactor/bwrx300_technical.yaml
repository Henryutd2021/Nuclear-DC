    title: "BWRX-300 General Description"
    publisher: "GE Vernova / Hitachi Nuclear Energy"
    year: 2024
    url: "https://www.gevernova.com/content/dam/gepower-new/global/en_US/images/gas-new-site/en/bwrx-300/005N9751_Rev_BWRX-300_General_Description.pdf"
    used_for: ["thermal_power_MW", "electric_power_*", "steam_pressure_MPa", "steam_temperature_C",
               "feedwater_temperature_C", "condenser_pressure_kPa", "refueling_cycle_months",
               "ramp_rate_pct_per_min", "footprint_hectares", "construction_period_FOAK_months"]

  - id: "IAEA-ARIS-2024"
    title: "Advances in Small Modular Reactor Technology Developments — 2024 Edition (ARIS)"
    publisher: "International Atomic Energy Agency, ARIS database"
    year: 2024
    url: "https://aris.iaea.org/Publications/SMR_catalogue_2024.pdf"
