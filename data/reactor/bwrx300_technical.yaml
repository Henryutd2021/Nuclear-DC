# BWRX-300 Technical Parameters
# Reactor: GE-Hitachi BWRX-300 Small Modular Reactor (Generation III+)
# Use: Paper 1 (AE) anchor reactor — single reactor unit, 870 MWth / 300 MWe(net)
#
# Sources are listed at file foot. Every value below traces to one of them.

reactor:
  vendor: "GE-Hitachi (a joint venture of GE Vernova and Hitachi)"
  type: "Natural-circulation Boiling Water Reactor (BWR), Gen III+"
  design_generation: "Tenth evolution of GE BWR (BWR-1 through ABWR/ESBWR lineage)"

  # --- Power ratings ---
  thermal_power_MW: 870           # nominal core thermal output  [source: GE-H general description; IAEA ARIS 2024]
  electric_power_gross_MW: 300    # gross electrical output  [GE-H 2024]
  electric_power_net_MW: 270      # net to grid (auxiliaries ~10%)  [IAEA ARIS 2024, p.BWRX-300 entry]
  electric_power_net_used_MW: 300 # paper convention — uses 'net 300 MWe' rounding consistent with vendor literature
  thermal_efficiency: 0.345       # 300 / 870 (rounded)  [derived]

  # --- Steam cycle (key for cogeneration coupling) ---
  steam_pressure_MPa: 7.17        # main steam pressure  [GE-H general description, Sec. 2]
  steam_temperature_C: 287.4      # saturated main steam @ 7.17 MPa  [steam tables; GE-H]
  steam_phase: "saturated"        # BWR direct-cycle saturated steam — NOT superheated
  feedwater_temperature_C: 215    # nominal feedwater  [GE-H general description]
  condenser_pressure_kPa: 6.9     # nominal condenser back-pressure (~5 inHg)  [GE-H]
  condenser_temperature_C: 38     # saturated water @ 6.9 kPa  [steam tables]

  # --- Operational characteristics ---
  capacity_factor_design: 0.95    # design CF (GE-H target; consistent with ESBWR-class)  [GE-H]
  capacity_factor_realistic: 0.92 # paper baseline assumption (consistent with mature US BWR fleet)  [EIA 2024 capacity factors]
  refueling_cycle_months: 24      # planned 24-month fuel cycle  [GE-H 2024]
  refueling_outage_days: 20       # short outage, simplified design  [GE-H 2024]

  # --- Ramping (used by optimizer ramp constraint) ---
  load_following_capable: true    # BWRX-300 designed for load-follow per IAEA ARIS entry
  min_load_fraction: 0.50         # safe minimum continuous power (typical BWR)  [IAEA ARIS]
  ramp_rate_pct_per_min: 1.0      # ~1% rated power / min (vendor cited; conservative)  [GE-H technical brochure]
  ramp_rate_MWth_per_hour: 522    # = 870 * 0.01 * 60  [derived]

  # --- Cogeneration interfaces (paper-specific, derived from steam cycle above) ---
  # See data/equipment/* for downstream ORC and absorption-chiller parameters.
  steam_extraction_options:
    high_pressure_extraction:
      pressure_bar: 25            # nominal HP extraction
      temperature_C: 224          # saturated @ 25 bar
      use_case: "Not used in this paper (reserved for industrial steam at higher T)"
    intermediate_pressure_extraction:
      pressure_bar: 7             # primary cogeneration tap — drives double-effect absorption
      temperature_C: 165
      use_case: "Drives double-effect LiBr-H2O absorption chiller (Case 2 / Case 3)"
    low_pressure_extraction:
      pressure_bar: 2             # secondary cogeneration tap — drives ORC bottoming cycle
      temperature_C: 120
      use_case: "Drives ORC bottoming cycle (Case 2)"

  # --- Plant footprint (informational; used in Discussion §5.X siting) ---
  footprint_hectares: 9           # ~9 ha for plant + emergency planning zone within site fence  [GE-H 2024]
  emergency_planning_zone_km: 0.4 # EPZ at site boundary (vendor claim, pending NRC ruling)
  construction_period_FOAK_months: 36  # vendor target  [GE-H 2024]

  # --- Regulatory status (informational, current as of May 2026) ---
  regulatory_milestones:
    NRC_design_certification_status: "Pre-application review since 2020; topical reports submitted"
    Canadian_CNSC_status: "Licensing for OPG Darlington (Canada) — construction license issued 2024-04"
    OPG_Darlington_unit1_target_operation: "2028-2029"  # OPG public schedule

# ==============================================================================
# SOURCES (verifiable, free-access)
# ==============================================================================
sources:
