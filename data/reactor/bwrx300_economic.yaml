# BWRX-300 Economic Parameters — Three-Scenario CAPEX/LCOE
# Used by paper Sensitivity dimension S4: CAPEX deployment-maturity (FOAK / ATB-Mid / NOAK)
#
# Critical paper claim: BWRX-300 OCC has a 6.5× real-world spread
# ($2,250 to $14,700 /kWe) depending on whether FOAK or NOAK is assumed.
# This is far larger than the standard ±30% sensitivity AE expects, and
# is the strongest narrative in the paper (S4 critical-point analysis).

# ------------------------------------------------------------------------------
# Three locked scenarios (paper §3 / §1.2.2)
# ------------------------------------------------------------------------------
scenarios:

  FOAK:
    label: "First-of-a-Kind — Ontario Power Generation Darlington empirical budget (SMR unit only)"
    overnight_capital_cost_usd_per_kWe: 14700
    lcoe_usd_per_mwh: 194              # MIT ANP-201 FOAK estimate (with ITC + LPO loan)
    description: |
      OPG Darlington Unit 1 CAPEX as approved by the Ontario provincial government
      in 2024-09. The SMR-unit budget is CAD 6.1B for one 300-MWe-net unit; the
      separate CAD 1.6B site-infrastructure budget covers common works shared
      across the four planned Darlington units and is excluded from this
      unit-level anchor. At 300 MWe net and USD/CAD ≈ 0.73 (2024-Q3 avg),
      CAD 6.1B implies USD ~14,800 /kWe overnight cost, rounded to 14,700.
      This is the only real-world budgeted cost figure for the BWRX-300 design.
    capex_breakdown:
      smr_unit_CAD: 6100000000        # 6.1 B CAD, OPG announcement 2024-09 (anchor basis)
      site_infrastructure_CAD: 1600000000  # 1.6 B CAD — shared 4-unit common works, excluded
      exchange_rate_usd_per_cad_2024Q3: 0.73
      smr_unit_USD: 4453000000        # = 6.1e9 × 0.73
      net_capacity_MW: 300
      occ_usd_per_kWe: 14700          # ≈ 4.453e9 / 300,000 = 14,843, rounded
    primary_source: "OPG-CNSC-2024"
    secondary_source: "WNN-2024-09"

  ATB_Mid:
    label: "NLR ATB 2024 Moderate — generic SMR mid-range"
    overnight_capital_cost_usd_per_kWe: 7615
    lcoe_usd_per_mwh: 130              # interpolated from ATB Moderate Nuclear-SMR 2030 cohort
    description: |
      NLR Annual Technology Baseline 2024 'Nuclear — SMR — Moderate' financial
      assumption for a generic light-water SMR. Treated as the intermediate point
      between FOAK realities and NOAK targets. Conservative-case = $8,017/kWe
      (not used as primary scenario; documented for completeness).
    primary_source: "NLR-ATB-2024-Nuclear"
    conservative_alternative_usd_per_kWe: 8017

  NOAK:
    label: "N-th-of-a-Kind — GE-Hitachi vendor target"
    overnight_capital_cost_usd_per_kWe: 2250
    lcoe_usd_per_mwh: 95               # MIT ANP-201 NOAK estimate
    description: |
      GE-Hitachi public statements (BWRX-300 fact sheets, investor materials)
      claim long-term NOAK overnight cost target of $2,250 /kWe assuming
      learning-by-doing across ≥10 units, supply-chain maturity, and regulatory
      precedent. This is a vendor target, NOT a budgeted figure, but it caps the
      lower bound of plausible long-run deployment cost.
    primary_source: "GE-Hitachi-2024"
    secondary_source: "MIT-ANP-201-2024"

# ------------------------------------------------------------------------------
# Cross-validation: INL meta-analysis range
# ------------------------------------------------------------------------------
sanity_check:
  source: "INL-RPT-24-77048"
  range_usd_per_kWe: [5000, 12000]
  notes: |
    Idaho National Laboratory 2024 meta-analysis of 35 bottom-up SMR cost
    estimates yields $5,000-12,000 /kWe range. Our three locked scenarios
    ($2,250 / $7,615 / $14,700) bracket this range, with FOAK above the high
    end (consistent with INL's noted FOAK premium) and NOAK below the low end
    (vendor-target territory, not yet empirically demonstrated).

# ------------------------------------------------------------------------------
# Fixed operating cost (FOM) — common across all 3 scenarios
# ------------------------------------------------------------------------------
fixed_om_usd_per_kWe_year: 121          # NLR ATB 2024 SMR Moderate
variable_om_usd_per_mwh: 3.50           # NLR ATB 2024 SMR Moderate (incl. minor consumables)
fuel_cost_usd_per_mwh_electric: 10.0    # $/MWh_e net basis (Li et al. 2026 Nat. Commun.);
                                        # ≈ 3.10 $/MWh_th at 270/870 net efficiency —
                                        # see data/economics/nuclear_fuel_cost.yaml

# ------------------------------------------------------------------------------
# Financial parameters (apply across all 3 scenarios)
# ------------------------------------------------------------------------------
financial:
  WACC_nominal: 0.067                   # 6.7% — NLR ATB 2024 default (private financing, US, nuclear)
  reactor_amortization_years: 40        # NLR ATB 2024 SMR convention; CRF 0.0724 @ 6.7%
  project_lifetime_years: 20            # TAC window for non-reactor assets; CRF 0.0922
  source: "NLR-ATB-2024"

