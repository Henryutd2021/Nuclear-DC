# Nuclear Fuel Costs — BWRX-300 / Light Water Reactor (LWR) Generic
# Basis: $/MWh_e of net electric generation (the basis fleet statistics and
# the companion Nature Communications study use). The model converts to a
# thermal-basis rate via the plant net efficiency and charges it on thermal
# power, so fuel spend stays proportional to the energy actually consumed:
#   Fuel_annual = fuel_cost_$/MWh_e × (P_e_net / P_th) × thermal_energy_MWh_th

fuel_cost:
  baseline_usd_per_mwh_electric: 10.0
  # = 10.0 × (270 / 870) at the BWRX-300 net efficiency (31.0%)
  baseline_usd_per_mwh_thermal_equiv: 3.10

  context: |
    $10/MWh_e covers the full front-end fuel cycle (uranium, conversion,
    enrichment, fabrication) plus the US spent-fuel disposal levy, at the
    upper end of published LWR fleet averages (~$5-6/MWh_e) to reflect the
    SMR first-core and smaller-batch fabrication premium. Same value used in
    the companion nuclear-hydrogen study (Li et al. 2026, Nature
    Communications). Fuel is a second-order cost lever: ~5-10% of nuclear
    LCOE versus the capital charge that dominates it.

