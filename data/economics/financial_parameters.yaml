    publisher: "Federal Register / Internal Revenue Service"
    year: 2025
    url: "https://www.federalregister.gov/documents/2025/08/25/2025-16249/publication-of-inflation-adjustment-factor-and-applicable-amounts-for-clean-electricity-production"
    used_for: ["ptc_usd_per_mwh_assumed"]

  - id: "IRS-45Y-CEPC"
    title: "Clean Electricity Production Credit (Section 45Y) — eligibility and credit amounts"
    publisher: "Internal Revenue Service"
