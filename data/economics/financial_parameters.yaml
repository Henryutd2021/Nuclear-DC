    title: "NLR ATB 2024 — Financial Assumptions"
    publisher: "NLR"
    year: 2024
    url: "https://atb.nlr.gov/electricity/2024/financial_cases_&_methods"
    used_for: ["WACC_nominal", "WACC_real", "inflation_rate", "project_lifetime_years",
               "capital_recovery_factor"]

  - id: "USC-26-45Y"
    title: "26 U.S.C. 45Y — Clean electricity production credit (credit amount, zero-GHG eligibility, 10-year credit period)"
    publisher: "Office of the Law Revision Counsel, U.S. Code"
    year: 2022
    url: "https://uscode.house.gov/view.xhtml?req=(title:26+section:45Y+edition:prelim)"
    used_for: ["ptc_usd_per_mwh_assumed", "ptc_credit_duration_years"]

  - id: "FR-2025-45Y-Amounts"
