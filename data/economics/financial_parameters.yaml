# Financial Parameters — Project Economics
# Used by paper: amortization of CAPEX in TAC, LCOE, LCOC calculations.

financial:
  WACC_nominal: 0.067                    # 6.7% — NLR ATB 2024 default for nuclear, US, private financing
  WACC_real: 0.044                       # ~ (1 + WACC_nominal) / (1 + inflation) - 1, with inflation ~2.2%
  inflation_rate: 0.022                  # US long-run CPI assumption
  project_lifetime_years: 20             # paper TAC comparison window (non-reactor assets)
  capital_recovery_factor: 0.0922        # CRF(i=6.7%, n=20); corrected from 0.0907 on 2026-05-19
  capital_recovery_factor_formula: "i*(1+i)^n / ((1+i)^n - 1)"

  # Reactor island amortization follows the NLR ATB 2024 SMR convention
  # (40 years, CRF 0.0724 at 6.7%) set per-case via reactor.lifetime_years
  # in config/plant_case{1,2}.yaml; physical life is longer still.
  reactor_physical_life_years: 60

  # Tax / subsidy environment — Section 45Y clean electricity production
  # credit (26 U.S.C. 45Y), the technology-neutral PTC available to zero-GHG
  # facilities placed in service after 2024 (a new-build SMR qualifies; the
  # legacy Section 45U credit was restricted to reactors already in service
  # before the IRA's enactment and is therefore not modeled). At the
  # prevailing-wage rate the inflation-adjusted credit for calendar 2025 is
  # 3.0 cents/kWh = $30/MWh (90 FR, Aug 25 2025). The credit is flat (no
  # gross-receipts phaseout) and runs for the statutory 10-year window from
  # commissioning; builder.py levelizes it across the 20-year TAC window via
  # the annuity-factor ratio (x0.657 at 6.7% -> $19.70/MWh effective).
  ptc_usd_per_mwh_assumed: 30            # prevailing-wage 45Y credit, CY2025 inflation-adjusted ($/MWh)
  ptc_credit_duration_years: 10          # 26 U.S.C. 45Y: 10-year credit period
  nuclear_ptc_enabled: true              # default-on in the Cases 1-2 baseline

# ==============================================================================
# SOURCES
# ==============================================================================
sources:
