# Battery Energy Storage System (Lithium-Ion) — Paper S3 Sensitivity
# Use: Paper Case 1-3 with/without 100 MWh BESS attachment (binary sensitivity).
# Paper question: does battery storage substitute for or complement heat recovery?

bess_liion:
  technology: "Lithium-Ion (LFP-dominated for grid-scale 2024)"
  configuration_paper: "100 MWh / 50 MW (2-hour duration)"

  economics:
    # NLR ATB 2024 utility-scale battery storage, Moderate, 2024 COD, 2-hour
    # duration (matches the modeled 100 MWh / 50 MW system). Overnight
    # capital basis in 2022$ — construction financing is carried by the
    # model's WACC/CRF annualization, not embedded in the unit cost.
    capex_total_2024_usd_per_kwh: 529          # 2-hr OCC ($529.18/kWh)
    capex_total_2024_usd_per_kw: 1058          # = 2 h × 529
    # ATB duration decomposition (linear across the 2/4/6/8/10-h entries):
    # OCC $/kW = 355.75 $/kWh × duration + 346.86 $/kW (energy + power blocks);
    # the 4-h point is $442/kWh on the same basis.
    capex_energy_block_usd_per_kwh: 356
    capex_power_block_usd_per_kw: 347
    fixed_om_usd_per_kw_year: 26.5             # ATB 2024 2-hr Moderate
    variable_om_usd_per_mwh: 0.5
    replacement_cycle_years: 10                # warranty cycle; refurb at year 10
    end_of_life_credit_pct: 5                  # salvage value of cells/casing

  technical:
    round_trip_efficiency: 0.85                # AC-AC including PCS losses
    self_discharge_per_day: 0.001              # 0.1 % / day (negligible at hourly resolution)
    depth_of_discharge_max: 0.95
    cycle_life_at_dod90: 6000                  # cycles before 20% capacity fade (LFP)
    calendar_life_years: 15
    c_rate_max_charge: 0.5                     # 2-hour
    c_rate_max_discharge: 0.5
    response_time_seconds: 0.2

  operational_paper_assumptions:
    initial_soc_fraction: 0.5
    final_soc_constraint: "soc_8760 = soc_0"   # cycle closure (paper baseline)
    soc_min_fraction: 0.05
    soc_max_fraction: 0.95

# ==============================================================================
# SOURCES
# ==============================================================================
sources:
  - id: "NLR-ATB-2024-Storage"
    title: "NLR ATB 2024 — Utility-Scale Battery Storage (2-hour duration, Moderate, 2024 COD)"
    publisher: "NLR"
    year: 2024
    url: "https://atb.nlr.gov/electricity/2024/utility-scale_battery_storage"
    used_for: ["economics.capex_*", "economics.fixed_om_usd_per_kw_year",
               "economics.variable_om_usd_per_mwh"]
    notes: "Values from the ATB 2024 v3.0.0 dataset (ATBe.csv, OEDI data lake); 2-hr OCC $529.18/kWh, FOM $26.46/kW-yr. Duration decomposition from the ATB battery cost equation: Total $/kW = pack $/kWh × duration + BOS $/kW."

  - id: "Lazard-LCOS-2024"
    title: "Lazard's Levelized Cost of Storage Analysis — Version 9.0"
    publisher: "Lazard"
    year: 2024
    url: "https://www.lazard.com/research-insights/levelized-cost-of-energy-2024/"
    used_for: ["economics.capex_total_2024_usd_per_kwh"]
    notes: "Industry-side cross-check on the 2-hr all-in capital range."
