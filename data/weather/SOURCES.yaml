# Weather Data Provenance — data/weather/*

houston_ambient_{2022,2023,2024}.csv:
  type: "REAL — Open-Meteo ERA5 historical-weather reanalysis, hourly"
  generated_by: "data/_raw/fetch_open_meteo_houston.py"
  location: "Houston, TX (29.76 N, -95.36 W)"
  variables:
    - "temperature_2m (dry-bulb, °C)"
    - "relative_humidity_2m (%)"
    - "wet_bulb_C — derived via the Stull (2011) empirical formula"
  horizon: "8760 hourly rows per calendar year (2024 trimmed from 8784)"
  used_by: "src/data.py:load_time_series (wet_bulb_C column)"
  notes: |
    These three files are the only weather inputs the model reads. They are
    tracked in git (Tier 1); the fetch script regenerates them byte-equivalent
    from the public Open-Meteo archive API.

sources:
  - id: "Open-Meteo-ERA5"
    title: "Open-Meteo Historical Weather API (ERA5 reanalysis)"
    publisher: "Open-Meteo / Copernicus ERA5"
    url: "https://open-meteo.com/en/docs/historical-weather-api"
    used_for: "Hourly dry-bulb, relative humidity 2022-2024"
  - id: "Stull-2011"
    title: "Wet-bulb temperature from relative humidity and air temperature"
    publisher: "Journal of Applied Meteorology and Climatology 50(11)"
    url: "https://doi.org/10.1175/JAMC-D-11-0143.1"
    used_for: "Wet-bulb derivation from dry-bulb + RH"
